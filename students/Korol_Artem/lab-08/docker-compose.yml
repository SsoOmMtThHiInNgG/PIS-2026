version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3-management

    ports:
      - "5672:5672"
      - "15672:15672"

  event-service:
    build: ./events-service

    ports:
      - "8080:8080"

    depends_on:
      - rabbitmq

  ticket-service:
    build: ./ticket-service

    ports:
      - "8081:8081"

    depends_on:
      - rabbitmq

  notification-service:
    build: ./notification-service

    depends_on:
      - rabbitmq

  api-gateway:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - event-service
      - ticket-service