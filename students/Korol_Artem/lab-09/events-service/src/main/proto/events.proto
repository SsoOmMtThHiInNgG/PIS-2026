syntax = "proto3";

package events;

option java_multiple_files = true;

service EventService {

  rpc PublishEvent(
      PublishEventRequest
  ) returns (EventResponse);

  rpc GetEvent(
      GetEventRequest
  ) returns (EventResponse);
}

service TicketService {

  rpc CreateTicket(
      CreateTicketRequest
  ) returns (TicketResponse);

  rpc StreamTickets(
      StreamTicketsRequest
  ) returns (stream TicketResponse);
}

message PublishEventRequest {
  int64 eventId = 1;
  string title = 2;
}

message GetEventRequest {
  int64 eventId = 1;
}

message EventResponse {
  int64 eventId = 1;
  string title = 2;
}

message CreateTicketRequest {
  int64 ticketId = 1;
  int64 eventId = 2;
}

message StreamTicketsRequest {
}

message TicketResponse {
  int64 ticketId = 1;
  int64 eventId = 2;
}